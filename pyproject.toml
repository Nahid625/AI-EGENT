[project]
name = "ai-egent"
version = "0.1.0"
description = "Deep Research AI Agent — FastAPI + LangChain/Groq"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", ".venv-1", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Side-effect imports: models must be imported so tables register on Base.metadata
"main.py" = ["F401", "E402"]
"alembic/env.py" = ["F401", "E402"]
# Re-export module
"src/tools/__init__.py" = ["F401"]
# conftest sets env vars before importing the app on purpose
"tests/conftest.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
